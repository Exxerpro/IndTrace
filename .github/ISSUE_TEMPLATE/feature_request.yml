name: Feature request
description: Propose a new capability or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        IndTrace **tracks and validates**; it never commands equipment. Proposals that make IndTrace drive
        machines or select routes are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this (signed off, under AGPL-3.0-or-later).
